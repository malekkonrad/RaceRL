behaviors:
  Racist:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5.1e6
    time_horizon: 64
    summary_freq: 5000

environment_parameters:
  track_index:
    curriculum:
      - name: easy
        value: 0
        completion_criteria:
          measure: reward
          behavior: Racist
          signal_smoothing: 50
          min_lesson_length: 100
          threshold: 20
      - name: hard
        value: 1
        completion_criteria:
          measure: reward
          behavior: Racist
          signal_smoothing: 50
          min_lesson_length: 100
          threshold: 40